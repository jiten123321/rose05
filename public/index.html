<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edd0cc">
<title>Just Roses, Ladoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400;1,6..96,500&family=Parisienne&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&display=swap">
<style>
  :root{
    color-scheme:light;
    --blush:#edd0cc; --blush-2:#f6e3df; --rose:#9b1328; --rose-2:#c2253d; --ink:#45171f; --ink-soft:#7d4a50; --ivory:#fbf4ec; --gold:#b98a4b;
  }
  html,body{background:var(--blush);}
  html{-webkit-text-size-adjust:100%;overflow-x:hidden;overflow-x:clip;}
  body{margin:0;color:var(--ink);font-family:"Crimson Pro", Georgia, "Times New Roman", serif;font-size:19px;line-height:1.55;
    padding-inline:16px;padding-block:calc(22px + env(safe-area-inset-top,0px)) calc(60px + env(safe-area-inset-bottom,0px));
    background:var(--blush);overflow-x:hidden;overflow-x:clip;}
  button{-webkit-tap-highlight-color:transparent;font:inherit;}
  #petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;}
  main{position:relative;z-index:2;max-width:560px;margin:0 auto;display:grid;gap:18px;}

  header{text-align:center;}
  .eyebrow{font-family:"Bodoni Moda", Georgia, serif;font-style:italic;font-size:16px;color:var(--ink-soft);}
  h1{font-family:"Parisienne", "Snell Roundhand", cursive;font-weight:400;font-size:clamp(54px,15vw,84px);line-height:1.05;margin:2px 0 6px;color:var(--rose);}
  .intro{text-align:center;max-width:30em;margin:0 auto;color:var(--ink);text-wrap:balance;}

  .stage{position:relative;width:min(100%, 620px, calc(76svh * 1100 / 1174));justify-self:center;aspect-ratio:1100/1174;touch-action:manipulation;user-select:none;-webkit-user-select:none;}
  .stage img{position:absolute;inset:0;width:100%;height:100%;display:block;
    opacity:0;}
  body.open .stage img{animation:bloom 2s cubic-bezier(.2,.7,.2,1) .35s both;}
  @keyframes bloom{0%{opacity:0;transform:scale(.86) translateY(24px);filter:blur(10px) saturate(.6)}60%{filter:blur(0) saturate(1.05)}100%{opacity:1;transform:none;filter:none}}
  body.open header,body.open .final{animation:rise 1.2s ease both;}
  body.open .final{animation-delay:1.6s;}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  body:not(.open) main{visibility:hidden;}
  body:not(.open){overflow:hidden;}

  /* ---- welcome ---- */
  .welcome{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;background:var(--blush);
    padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));transition:opacity .9s ease, transform 1s cubic-bezier(.6,0,.3,1);}
  .welcome.gone{opacity:0;transform:translateY(-4%);pointer-events:none;}
  .welcome .inner{display:grid;justify-items:center;gap:14px;max-width:26em;}
  .bud{width:74px;height:auto;filter:drop-shadow(0 8px 14px rgba(120,20,40,.25));animation:sway 4s ease-in-out infinite;transform-origin:50% 100%;}
  @keyframes sway{50%{transform:rotate(4deg)}}
  .welcome .hey{font-family:"Parisienne","Snell Roundhand",cursive;font-size:clamp(60px,17vw,92px);line-height:1;color:var(--rose);margin:0;font-weight:400;}
  .welcome p{margin:0;font-size:20px;color:var(--ink);text-wrap:balance;}
  .open-btn{margin-top:14px;border:0;border-radius:999px;padding:15px 30px;background:linear-gradient(180deg,var(--rose-2),var(--rose));color:var(--ivory);
    font-family:"Bodoni Moda",Georgia,serif;font-style:italic;font-size:19px;letter-spacing:.02em;cursor:pointer;
    box-shadow:0 10px 26px rgba(155,19,40,.35),inset 0 1px 0 rgba(255,255,255,.25);animation:breathe 2.4s ease-in-out infinite;}
  .open-btn:focus-visible{outline:2px solid var(--rose);outline-offset:4px;}
  .open-btn:active{transform:scale(.97);}
  @keyframes breathe{50%{box-shadow:0 12px 34px rgba(155,19,40,.5),0 0 0 8px rgba(155,19,40,.08),inset 0 1px 0 rgba(255,255,255,.25)}}
  .welcome small{font-style:italic;color:var(--ink-soft);font-size:15px;}
  .r{position:absolute;transform:translate(-50%,-50%);width:13%;min-width:40px;aspect-ratio:1;border-radius:50%;border:0;padding:0;background:transparent;cursor:pointer;}
  .r::after{content:"";position:absolute;inset:18%;border-radius:50%;box-shadow:0 0 0 0 rgba(255,244,236,.0);transition:box-shadow .4s;}
  .r:hover::after,.r:focus-visible::after{box-shadow:0 0 0 2px rgba(255,244,236,.9),0 0 18px 6px rgba(255,220,215,.6);}
  .r:focus-visible{outline:none;}
  .r.hint::before{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--ivory);animation:pulse 1.8s ease-out infinite;}
  .stage.started .r.hint::before{display:none;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(251,244,236,.9)}100%{box-shadow:0 0 0 16px rgba(251,244,236,0)}}
  .r.picked::after{inset:36%;background:radial-gradient(circle,#fff8f0 0 30%,rgba(255,248,240,.0) 70%);box-shadow:0 0 12px 4px rgba(255,236,226,.75);animation:glow 2.6s ease-in-out infinite;}
  @keyframes glow{50%{box-shadow:0 0 18px 7px rgba(255,236,226,.9)}}
  .burst{position:absolute;z-index:5;width:14px;height:18px;border-radius:60% 60% 50% 50%/70% 70% 40% 40%;pointer-events:none;background:radial-gradient(circle at 40% 30%,#d8334c,#8e1024);animation:fall 2.2s ease-in forwards;}
  @keyframes fall{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot))}}

  .tally{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:-4px;}
  .tally i{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(155,19,40,.45);transition:background .4s, transform .4s;}
  .tally i.on{background:var(--rose);border-color:var(--rose);transform:scale(1.15);}
  .tally i.promise{border-radius:3px;transform:rotate(45deg);}
  .tally i.promise.on{transform:rotate(45deg) scale(1.15);}

  .card{position:relative;background:var(--ivory);border-radius:18px;padding:18px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(120,40,50,.12),0 0 0 1px rgba(155,19,40,.08);min-height:118px;display:grid;align-content:center;gap:6px;}
  .card .num{font-family:"Bodoni Moda",Georgia,serif;font-style:italic;font-size:15px;color:var(--gold);letter-spacing:.02em;font-variant-numeric:lining-nums;}
  .card .txt{font-size:22px;line-height:1.35;text-wrap:balance;}
  .card.flash{animation:flash .6s ease;}
  @keyframes flash{from{transform:scale(.97);background:#fde8e6}to{transform:none;background:var(--ivory)}}

  .final{text-align:center;display:grid;gap:4px;padding-top:6px;}
  .final p{margin:0;font-style:italic;color:var(--ink-soft);text-wrap:balance;}
  .sign{font-family:"Parisienne",cursive;font-size:40px;color:var(--rose);line-height:1.1;}

  @media (max-width:520px){
    body{font-size:18px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px));}
    main{gap:14px;}
    .eyebrow{font-size:15px;}
    .card{padding:14px 16px 16px;min-height:104px;}
    .card .txt{font-size:20px;}
    .sign{font-size:36px;}
  }
  @media (max-width:360px){body{font-size:17px;}.card .txt{font-size:18px;}}
  @media (max-width:652px) and (min-height:501px){.stage{width:calc(100% + 32px);margin-inline:-16px;}}
  @media (orientation:landscape) and (max-height:500px){.stage{width:min(100%, calc(92svh * 1100 / 1174));}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.15s!important;}}
</style>
</head>

<div class="welcome" id="welcome">
  <div class="inner">
    <svg class="bud" viewBox="0 0 80 120" aria-hidden="true">
      <defs><radialGradient id="bg1" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#e0405a"/><stop offset=".6" stop-color="#b3172f"/><stop offset="1" stop-color="#7a0b1f"/></radialGradient></defs>
      <path d="M40 118 C40 95 41 80 40 62" stroke="#4f7a3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M40 92 C28 86 20 88 14 96 C24 100 33 98 40 92Z" fill="#5f8a45"/>
      <path d="M40 60 C22 58 16 40 22 24 C28 12 36 6 40 4 C44 6 52 12 58 24 C64 40 58 58 40 60Z" fill="url(#bg1)"/>
      <path d="M40 60 C30 52 29 36 36 20 M40 60 C50 52 52 38 46 22" stroke="#7a0b1f" stroke-width="1.4" fill="none" opacity=".6"/>
      <path d="M40 62 C30 64 24 58 22 50 C30 54 36 56 40 56 C44 56 50 54 58 50 C56 58 50 64 40 62Z" fill="#4f7a3a"/>
    </svg>
    <h2 class="hey">Hey Ladoo</h2>
    <p>I have something for you.</p>
    <button class="open-btn" id="openBtn" type="button">Open your flowers</button>
    <small>Tap to open</small>
  </div>
</div>

  /* falling rose petals */
  const cv=document.getElementById('petals'),c=cv.getContext('2d');let W,H,ps=[];
  function mk(top){return{x:Math.random()*W,y:top?-30:Math.random()*H,s:7+Math.random()*9,vy:.45+Math.random()*.7,sw:Math.random()*6.28,sws:.01+Math.random()*.015,
    rot:Math.random()*6.28,vr:(Math.random()-.5)*.03,flip:Math.random()*6.28,vf:.02+Math.random()*.03,hue:Math.random()};}
  function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;c.setTransform(d,0,0,d,0,0);
    const n=Math.round(Math.min(18,W*H/40000)+4);ps=Array.from({length:n},()=>mk(false));}
  function petal(p){
    c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.scale(Math.cos(p.flip)*.8+.2*Math.sign(Math.cos(p.flip)||1),1);
    const s=p.s,g=c.createRadialGradient(-s*.2,-s*.3,s*.1,0,0,s*1.2);
    const a=p.hue<.5?['#e2485f','#b5182f','#7e0c20']:['#d12d45','#a0142a','#6c0a1b'];
    g.addColorStop(0,a[0]);g.addColorStop(.6,a[1]);g.addColorStop(1,a[2]);
    c.fillStyle=g;c.globalAlpha=.9;
    c.beginPath();c.moveTo(0,s);c.bezierCurveTo(s*1.1,s*.5,s*.9,-s*1.1,0,-s*.75);c.bezierCurveTo(-s*.9,-s*1.1,-s*1.1,s*.5,0,s);c.fill();
    c.globalAlpha=.25;c.strokeStyle='#ffd1d8';c.lineWidth=.8;c.beginPath();c.moveTo(0,s*.8);c.quadraticCurveTo(s*.1,0,0,-s*.5);c.stroke();
    c.restore();
  }
  function tick(){
    c.clearRect(0,0,W,H);
    for(const p of ps){
      if(!reduce){p.sw+=p.sws;p.x+=Math.sin(p.sw)*.7;p.y+=p.vy;p.rot+=p.vr;p.flip+=p.vf;if(p.y>H+30)Object.assign(p,mk(true));}
      petal(p);
    }
    if(!reduce) requestAnimationFrame(tick);
  }
  size();addEventListener('resize',size);requestAnimationFrame(tick);
})();
</script>
</body>
